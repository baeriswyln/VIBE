[project]
name = "myodetector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bleak>=3.0.2",
    "numpy>=2.4.4",
    "pyttsx3>=2.99",
    "scikit-learn>=1.8.0",
    "sounddevice>=0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myo"]
